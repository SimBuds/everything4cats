# Refuse xmlrpc.php everywhere.
#
# Copied into /etc/apache2/conf-available/ and enabled with a2enconf, by both
# the Dockerfile and scripts/provision.sh.
#
# WHY SERVER SCOPE RATHER THAN THE VHOST
#
# provision.sh manages only sites-available/everything4cats.conf, the port 80
# vhost. Certbot generates everything4cats-le-ssl.conf for 443 and the repo does
# not manage it. The live site serves HTTPS and redirects all HTTP to it, so a
# <Files> block in the managed vhost would guard the one path nobody uses and
# leave https://everything4cats.ca/xmlrpc.php fully open. A fragment here
# applies to every vhost, including the one certbot writes, and survives certbot
# regenerating it.
#
# WHY APACHE RATHER THAN A WORDPRESS FILTER
#
# add_filter( 'xmlrpc_enabled', '__return_false' ) still boots PHP and WordPress
# for every attempt, so the amplification still costs the server, and it governs
# only the authenticated methods. Apache refuses before PHP starts, and no
# plugin setting can switch it back on.
#
# WHAT THIS ACTUALLY CLOSES
#
# Measured on this stack 2026-08-11, before the block existed: GET /xmlrpc.php
# returned 405, which reads like a refusal and is not one, while POST returned
# 200 and answered system.listMethods advertising system.multicall and
# pingback.ping. system.multicall is the amplifier: it carries many method calls
# in a single HTTP request, so hundreds of password attempts arrive as one
# request. That is precisely what a login throttler counting requests cannot
# see, and it is why this is closed at the web server rather than rate limited.
#
# Nothing in scripts/plugins.txt uses xmlrpc. Jetpack is not installed, and the
# WordPress mobile app uses the REST API. Pingbacks are lost deliberately: they
# are a spam vector this site has no use for.

<Files "xmlrpc.php">
    Require all denied
</Files>
