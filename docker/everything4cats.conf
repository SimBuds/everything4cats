# Everything4Cats vhost. Copied into /etc/apache2/sites-available/ by the Dockerfile.
#
# On a real host this is the same file, in the same place. Only the ServerName
# changes: `localhost` here, the domain in production.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/everything4cats

    <Directory /var/www/everything4cats>
        # -Indexes stops Apache listing directory contents when no index file
        # exists, which otherwise exposes the file layout to anyone browsing.
        Options -Indexes +FollowSymLinks

        # AllowOverride All lets WordPress's .htaccess take effect. Permalinks
        # depend on it: without it every URL except the homepage returns 404.
        AllowOverride All
        Require all granted
    </Directory>

    # Per-site logs. Once staging and production are two vhosts on one host, a
    # shared log makes "which site threw this" guesswork.
    ErrorLog ${APACHE_LOG_DIR}/everything4cats-error.log
    CustomLog ${APACHE_LOG_DIR}/everything4cats-access.log combined
</VirtualHost>
